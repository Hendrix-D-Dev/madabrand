<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Content Editor · MadaBrand Admin</title>
    <link href="/dist/output.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Include admin CSS -->
    <link href="/admin/css/admin.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            overflow-x: hidden;
        }

        /* Simple gradient background instead of Vanta */
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        /* Layout */
        .app-wrapper {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid rgba(30, 58, 138, 0.1);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 30;
            overflow-y: auto;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.02);
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid #eef2f6;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .sidebar-logo-text {
            font-weight: 700;
            font-size: 1.25rem;
            color: #1e293b;
        }
        .sidebar-logo-text span {
            color: #1e3a8a;
        }

        .sidebar-nav {
            padding: 24px 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: #64748b;
            transition: all 0.2s;
            margin-bottom: 4px;
            text-decoration: none;
        }
        .nav-item i {
            width: 20px;
            font-size: 1.1rem;
        }
        .nav-item:hover {
            background: #f1f5f9;
            color: #1e3a8a;
        }
        .nav-item.active {
            background: #eef2ff;
            color: #1e3a8a;
            font-weight: 500;
        }

        .nav-divider {
            height: 1px;
            background: #eef2f6;
            margin: 20px 0;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 24px 32px;
            position: relative;
            z-index: 20;
        }

        /* Top Bar */
        .top-bar {
            background: white;
            border-radius: 20px;
            padding: 16px 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
        }
        .page-title p {
            color: #64748b;
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .save-indicator {
            background: #10b981;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .save-indicator.saving {
            background: #f59e0b;
        }

        /* Tabs */
        .tabs-container {
            background: white;
            border-radius: 16px 16px 0 0;
            border-bottom: 1px solid #eef2f6;
            padding: 0 16px;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .tab {
            padding: 16px 24px;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab:hover {
            color: #1e3a8a;
        }
        .tab.active {
            color: #1e3a8a;
            border-bottom-color: #1e3a8a;
        }

        /* Editor Panel */
        .editor-panel {
            background: white;
            border-radius: 0 0 20px 20px;
            padding: 32px;
        }

        .editor-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #eef2f6;
        }
        .editor-section h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #475569;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.2s;
            font-size: 0.95rem;
            background: white;
        }
        .form-control:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
            outline: none;
        }
        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .char-counter {
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: right;
            margin-top: 4px;
        }
        .char-counter.warning {
            color: #f59e0b;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .service-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #eef2f6;
            position: relative;
        }
        .service-card:hover {
            border-color: #1e3a8a;
        }
        .service-remove {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .service-card:hover .service-remove {
            opacity: 1;
        }

        .add-service-btn {
            padding: 16px;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            background: #f8fafc;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .add-service-btn:hover {
            border-color: #1e3a8a;
            color: #1e3a8a;
            background: #f1f5f9;
        }

        /* Save Bar */
        .save-bar {
            position: sticky;
            bottom: 24px;
            display: flex;
            justify-content: flex-end;
            margin-top: 32px;
        }
        .save-btn {
            background: #10b981;
            color: white;
            padding: 16px 32px;
            border-radius: 40px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        .save-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 30px -5px rgba(16, 185, 129, 0.5);
        }

        /* Preview Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h3 {
            font-weight: 600;
            color: #1e293b;
        }
        .modal-close {
            cursor: pointer;
            font-size: 1.5rem;
            color: #94a3b8;
            transition: color 0.2s;
        }
        .modal-close:hover {
            color: #1e3a8a;
        }
        .modal-body {
            padding: 24px;
        }

        /* Mobile Menu Button */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 40;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 24px 16px;
            }
            .mobile-menu-btn {
                display: block;
            }
            .tabs {
                overflow-x: auto;
                white-space: nowrap;
                display: flex;
                flex-wrap: nowrap;
            }
        }

        @media (max-width: 640px) {
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .editor-panel {
                padding: 20px 16px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .services-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 16px 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
            border-left: 4px solid;
        }
        .toast.success { border-color: #10b981; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Simple gradient background instead of Vanta -->
    <div class="fixed inset-0 bg-gradient-to-br from-blue-50 via-white to-blue-50 opacity-90"></div>

    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars text-xl text-blue-900"></i>
    </button>

    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div id="nav-container"></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="page-title">
                    <h1>Content Editor</h1>
                    <p>Edit your website content</p>
                </div>
                <div class="save-indicator" id="saveIndicator">
                    <i class="fas fa-check-circle"></i>
                    <span>All changes saved</span>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs-container">
                <div class="tabs">
                    <div class="tab active" data-tab="home">
                        <i class="fas fa-home"></i>
                        Home Page
                    </div>
                    <div class="tab" data-tab="about">
                        <i class="fas fa-user"></i>
                        About Page
                    </div>
                    <div class="tab" data-tab="services">
                        <i class="fas fa-cog"></i>
                        Services Page
                    </div>
                    <div class="tab" data-tab="global">
                        <i class="fas fa-globe"></i>
                        Global Settings
                    </div>
                </div>
            </div>

            <!-- Editor Panels -->
            <div class="editor-panel">
                <!-- HOME PANEL -->
                <div id="panel-home" class="tab-panel">
                    <!-- Hero Section -->
                    <div class="editor-section">
                        <h3>
                            <i class="fas fa-bullseye text-blue-900"></i>
                            Hero Section
                        </h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Badge Text</label>
                                <input type="text" id="homeBadge" class="form-control" value="Lagos Premier Design Studio" maxlength="50">
                                <div class="char-counter" id="homeBadgeCounter">0/50</div>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Heading Line 1</label>
                                <input type="text" id="homeLine1" class="form-control" value="Start Your">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Heading Line 2</label>
                                <input type="text" id="homeLine2" class="form-control" value="Brand Journey">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea id="homeDesc" class="form-control" maxlength="200">Based in Lagos, serving Nigeria and the world. Get in touch for a personalized consultation with transparent pricing.</textarea>
                            <div class="char-counter" id="homeDescCounter">0/200</div>
                        </div>
                    </div>

                    <!-- CTA Section -->
                    <div class="editor-section">
                        <h3>
                            <i class="fas fa-bolt text-blue-900"></i>
                            Call to Action
                        </h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Primary Button Text</label>
                                <input type="text" id="homeCtaPrimary" class="form-control" value="Email Us">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Primary Button Link</label>
                                <input type="text" id="homeCtaPrimaryLink" class="form-control" value="mailto:macaulaymadalene@gmail.com">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Secondary Button Text</label>
                                <input type="text" id="homeCtaSecondary" class="form-control" value="Call Now">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Secondary Button Link</label>
                                <input type="text" id="homeCtaSecondaryLink" class="form-control" value="tel:08104902357">
                            </div>
                        </div>
                    </div>

                    <!-- Stats Section -->
                    <div class="editor-section">
                        <h3>
                            <i class="fas fa-chart-bar text-blue-900"></i>
                            Statistics
                        </h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Stat 1 Value</label>
                                <input type="text" id="homeStat1Val" class="form-control" value="50+">
                                <label class="form-label mt-2">Stat 1 Label</label>
                                <input type="text" id="homeStat1Label" class="form-control" value="Projects">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Stat 2 Value</label>
                                <input type="text" id="homeStat2Val" class="form-control" value="100%">
                                <label class="form-label mt-2">Stat 2 Label</label>
                                <input type="text" id="homeStat2Label" class="form-control" value="Satisfaction">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Stat 3 Value</label>
                                <input type="text" id="homeStat3Val" class="form-control" value="15+">
                                <label class="form-label mt-2">Stat 3 Label</label>
                                <input type="text" id="homeStat3Label" class="form-control" value="Industries">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Stat 4 Value</label>
                                <input type="text" id="homeStat4Val" class="form-control" value="3+">
                                <label class="form-label mt-2">Stat 4 Label</label>
                                <input type="text" id="homeStat4Label" class="form-control" value="Years">
                            </div>
                        </div>
                    </div>

                    <!-- Testimonial -->
                    <div class="editor-section">
                        <h3>
                            <i class="fas fa-quote-right text-blue-900"></i>
                            Testimonial
                        </h3>
                        <div class="form-group">
                            <label class="form-label">Testimonial Text</label>
                            <textarea id="homeTestimonial" class="form-control" maxlength="300">"MadaBrand created a brand identity that perfectly captures our vision."</textarea>
                            <div class="char-counter" id="homeTestimonialCounter">0/300</div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Author</label>
                                <input type="text" id="homeTestAuthor" class="form-control" value="Nuel Ark">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Author Title</label>
                                <input type="text" id="homeTestTitle" class="form-control" value="CEO, NuelArk Construction">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ABOUT PANEL -->
                <div id="panel-about" class="tab-panel hidden">
                    <div class="editor-section">
                        <h3>
                            <i class="fas fa-book-open text-blue-900"></i>
                            Our Story
                        </h3>
                        <div class="form-group">
                            <label class="form-label">Title</label>
                            <input type="text" id="aboutTitle" class="form-control" value="From Passion to Premium Design Studio">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Paragraph 1</label>
                            <textarea id="aboutPara1" class="form-control" rows="3">Founded in Lagos with a vision to transform how Nigerian businesses present themselves to the world...</textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Paragraph 2</label>
                            <textarea id="aboutPara2" class="form-control" rows="3">Our journey has been marked by a relentless pursuit of design excellence...</textarea>
                        </div>
                    </div>

                    <div class="editor-section">
                        <h3>
                            <i class="fas fa-quote-left text-blue-900"></i>
                            Founder's Quote
                        </h3>
                        <div class="form-group">
                            <textarea id="aboutQuote" class="form-control" rows="2">Every brand has a unique story waiting to be told.</textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Author</label>
                                <input type="text" id="aboutQuoteAuthor" class="form-control" value="Macaulay Madalene">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Title</label>
                                <input type="text" id="aboutQuoteTitle" class="form-control" value="Founder & Creative Director">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SERVICES PANEL -->
                <div id="panel-services" class="tab-panel hidden">
                    <div class="services-grid" id="servicesGrid">
                        <!-- Services will be injected here -->
                    </div>
                    <button class="add-service-btn" onclick="addService()">
                        <i class="fas fa-plus"></i>
                        Add New Service
                    </button>
                </div>

                <!-- GLOBAL PANEL -->
                <div id="panel-global" class="tab-panel hidden">
                    <div class="editor-section">
                        <h3>
                            <i class="fas fa-search text-blue-900"></i>
                            SEO Settings
                        </h3>
                        <div class="form-group">
                            <label class="form-label">Site Title</label>
                            <input type="text" id="globalSiteTitle" class="form-control" value="MadaBrand | Premium Design Studio Lagos">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Meta Description</label>
                            <textarea id="globalMetaDesc" class="form-control" maxlength="160">Premium brand design, logo design, and graphic design services in Lagos, Nigeria.</textarea>
                            <div class="char-counter" id="globalMetaCounter">0/160</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Keywords</label>
                            <input type="text" id="globalKeywords" class="form-control" value="brand design, logo design, graphic design, Nigeria, Lagos">
                        </div>
                    </div>

                    <div class="editor-section">
                        <h3>
                            <i class="fas fa-phone text-blue-900"></i>
                            Contact Information
                        </h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" id="globalEmail" class="form-control" value="macaulaymadalene@gmail.com">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone</label>
                                <input type="text" id="globalPhone" class="form-control" value="08104902357">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">WhatsApp</label>
                                <input type="text" id="globalWhatsapp" class="form-control" value="2348104902357">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Address</label>
                                <input type="text" id="globalAddress" class="form-control" value="No 6, Simeon Edun Street, Iyana Era, Lagos">
                            </div>
                        </div>
                    </div>

                    <div class="editor-section">
                        <h3>
                            <i class="fas fa-share-alt text-blue-900"></i>
                            Social Media
                        </h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Instagram</label>
                                <input type="text" id="socialInstagram" class="form-control" placeholder="https://instagram.com/...">
                            </div>
                            <div class="form-group">
                                <label class="form-label">LinkedIn</label>
                                <input type="text" id="socialLinkedin" class="form-control" placeholder="https://linkedin.com/...">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Behance</label>
                                <input type="text" id="socialBehance" class="form-control" placeholder="https://behance.net/...">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Dribbble</label>
                                <input type="text" id="socialDribbble" class="form-control" placeholder="https://dribbble.com/...">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Save Bar -->
                <div class="save-bar">
                    <button class="save-btn" onclick="saveAllContent()">
                        <i class="fas fa-save"></i>
                        Save All Changes
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal hidden" onclick="if(event.target === this) closePreviewModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Preview</h3>
                <span class="modal-close" onclick="closePreviewModal()">&times;</span>
            </div>
            <div class="modal-body" id="previewContent">
                <!-- Preview content -->
            </div>
        </div>
    </div>

    <script>
        // Auth check
        if (!sessionStorage.getItem('adminAuth') && !localStorage.getItem('adminRemember')) {
            window.location.href = '/admin/login.html';
        }

        // Load navigation
        fetch('/admin/components/nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-container').innerHTML = data;
            })
            .catch(error => {
                console.error('Error loading nav:', error);
                document.getElementById('nav-container').innerHTML = '<div class="p-4 text-red-500">Error loading navigation</div>';
            });

        // Sidebar toggle - FIXED
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        document.addEventListener('click', function(e) {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.querySelector('.mobile-menu-btn');
            if (window.innerWidth <= 1024 && 
                sidebar && 
                !sidebar.contains(e.target) && 
                menuBtn && 
                !menuBtn.contains(e.target) && 
                sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            }
        });

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
                document.getElementById(`panel-${this.dataset.tab}`).classList.remove('hidden');
            });
        });

        // Services data
        let services = [
            { icon: '🎨', title: 'Complete Brand Identity', desc: 'Full visual systems including logos, color palettes, and brand guidelines.' },
            { icon: '✨', title: 'Logo & Visual Identity', desc: 'Strategic logo design that communicates your brand\'s unique story.' },
            { icon: '📱', title: 'Brand Applications', desc: 'Real-world implementation across business cards, packaging, and digital platforms.' }
        ];

        // Render services
        function renderServices() {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = services.map((s, index) => `
                <div class="service-card">
                    <div class="service-remove" onclick="removeService(${index})">
                        <i class="fas fa-times"></i>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Icon</label>
                        <input type="text" class="form-control service-icon" value="${s.icon}" data-index="${index}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control service-title" value="${s.title}" data-index="${index}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-control service-desc" data-index="${index}" rows="2">${s.desc}</textarea>
                    </div>
                </div>
            `).join('');

            // Add event listeners to update services array
            document.querySelectorAll('.service-icon, .service-title, .service-desc').forEach(input => {
                input.addEventListener('input', function() {
                    const index = this.dataset.index;
                    if (this.classList.contains('service-icon')) services[index].icon = this.value;
                    if (this.classList.contains('service-title')) services[index].title = this.value;
                    if (this.classList.contains('service-desc')) services[index].desc = this.value;
                    triggerAutoSave();
                });
            });
        }

        // Add service
        window.addService = function() {
            services.push({ icon: '✨', title: 'New Service', desc: 'Description here' });
            renderServices();
            triggerAutoSave();
        };

        // Remove service
        window.removeService = function(index) {
            services.splice(index, 1);
            renderServices();
            triggerAutoSave();
        };

        // Character counters
        function setupCounters() {
            const counters = [
                { input: 'homeBadge', counter: 'homeBadgeCounter', max: 50 },
                { input: 'homeDesc', counter: 'homeDescCounter', max: 200 },
                { input: 'homeTestimonial', counter: 'homeTestimonialCounter', max: 300 },
                { input: 'globalMetaDesc', counter: 'globalMetaCounter', max: 160 }
            ];

            counters.forEach(c => {
                const input = document.getElementById(c.input);
                const counter = document.getElementById(c.counter);
                
                function update() {
                    const len = input.value.length;
                    counter.textContent = `${len}/${c.max}`;
                    counter.classList.toggle('warning', len > c.max * 0.9);
                }
                
                input.addEventListener('input', update);
                update();
            });
        }

        // Auto-save
        let saveTimer;
        function triggerAutoSave() {
            const indicator = document.getElementById('saveIndicator');
            indicator.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            indicator.classList.add('saving');
            
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                saveAllContent(true);
            }, 2000);
        }

        // Add input listeners
        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('input', triggerAutoSave);
        });

        // Save all content
        window.saveAllContent = function(isAutoSave = false) {
            const content = {
                home: {
                    badge: document.getElementById('homeBadge').value,
                    line1: document.getElementById('homeLine1').value,
                    line2: document.getElementById('homeLine2').value,
                    desc: document.getElementById('homeDesc').value,
                    ctaPrimary: document.getElementById('homeCtaPrimary').value,
                    ctaPrimaryLink: document.getElementById('homeCtaPrimaryLink').value,
                    ctaSecondary: document.getElementById('homeCtaSecondary').value,
                    ctaSecondaryLink: document.getElementById('homeCtaSecondaryLink').value,
                    stats: [
                        { val: document.getElementById('homeStat1Val').value, label: document.getElementById('homeStat1Label').value },
                        { val: document.getElementById('homeStat2Val').value, label: document.getElementById('homeStat2Label').value },
                        { val: document.getElementById('homeStat3Val').value, label: document.getElementById('homeStat3Label').value },
                        { val: document.getElementById('homeStat4Val').value, label: document.getElementById('homeStat4Label').value }
                    ],
                    testimonial: {
                        text: document.getElementById('homeTestimonial').value,
                        author: document.getElementById('homeTestAuthor').value,
                        title: document.getElementById('homeTestTitle').value
                    }
                },
                about: {
                    title: document.getElementById('aboutTitle').value,
                    para1: document.getElementById('aboutPara1').value,
                    para2: document.getElementById('aboutPara2').value,
                    quote: document.getElementById('aboutQuote').value,
                    quoteAuthor: document.getElementById('aboutQuoteAuthor').value,
                    quoteTitle: document.getElementById('aboutQuoteTitle').value
                },
                services: services,
                global: {
                    siteTitle: document.getElementById('globalSiteTitle').value,
                    metaDesc: document.getElementById('globalMetaDesc').value,
                    keywords: document.getElementById('globalKeywords').value,
                    email: document.getElementById('globalEmail').value,
                    phone: document.getElementById('globalPhone').value,
                    whatsapp: document.getElementById('globalWhatsapp').value,
                    address: document.getElementById('globalAddress').value,
                    social: {
                        instagram: document.getElementById('socialInstagram').value,
                        linkedin: document.getElementById('socialLinkedin').value,
                        behance: document.getElementById('socialBehance').value,
                        dribbble: document.getElementById('socialDribbble').value
                    }
                },
                lastUpdated: new Date().toISOString()
            };

            localStorage.setItem('madabrandContent', JSON.stringify(content));

            const indicator = document.getElementById('saveIndicator');
            indicator.innerHTML = '<i class="fas fa-check-circle"></i> All changes saved';
            indicator.classList.remove('saving');

            if (!isAutoSave) {
                showToast('Content saved!', 'success');
            }
        };

        // Load saved content
        function loadContent() {
            const saved = localStorage.getItem('madabrandContent');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    
                    // Home
                    if (data.home) {
                        document.getElementById('homeBadge').value = data.home.badge || '';
                        document.getElementById('homeLine1').value = data.home.line1 || '';
                        document.getElementById('homeLine2').value = data.home.line2 || '';
                        document.getElementById('homeDesc').value = data.home.desc || '';
                        document.getElementById('homeCtaPrimary').value = data.home.ctaPrimary || '';
                        document.getElementById('homeCtaPrimaryLink').value = data.home.ctaPrimaryLink || '';
                        document.getElementById('homeCtaSecondary').value = data.home.ctaSecondary || '';
                        document.getElementById('homeCtaSecondaryLink').value = data.home.ctaSecondaryLink || '';
                        
                        if (data.home.stats) {
                            document.getElementById('homeStat1Val').value = data.home.stats[0]?.val || '';
                            document.getElementById('homeStat1Label').value = data.home.stats[0]?.label || '';
                            document.getElementById('homeStat2Val').value = data.home.stats[1]?.val || '';
                            document.getElementById('homeStat2Label').value = data.home.stats[1]?.label || '';
                            document.getElementById('homeStat3Val').value = data.home.stats[2]?.val || '';
                            document.getElementById('homeStat3Label').value = data.home.stats[2]?.label || '';
                            document.getElementById('homeStat4Val').value = data.home.stats[3]?.val || '';
                            document.getElementById('homeStat4Label').value = data.home.stats[3]?.label || '';
                        }
                        
                        if (data.home.testimonial) {
                            document.getElementById('homeTestimonial').value = data.home.testimonial.text || '';
                            document.getElementById('homeTestAuthor').value = data.home.testimonial.author || '';
                            document.getElementById('homeTestTitle').value = data.home.testimonial.title || '';
                        }
                    }

                    // About
                    if (data.about) {
                        document.getElementById('aboutTitle').value = data.about.title || '';
                        document.getElementById('aboutPara1').value = data.about.para1 || '';
                        document.getElementById('aboutPara2').value = data.about.para2 || '';
                        document.getElementById('aboutQuote').value = data.about.quote || '';
                        document.getElementById('aboutQuoteAuthor').value = data.about.quoteAuthor || '';
                        document.getElementById('aboutQuoteTitle').value = data.about.quoteTitle || '';
                    }

                    // Services
                    if (data.services) {
                        services = data.services;
                        renderServices();
                    }

                    // Global
                    if (data.global) {
                        document.getElementById('globalSiteTitle').value = data.global.siteTitle || '';
                        document.getElementById('globalMetaDesc').value = data.global.metaDesc || '';
                        document.getElementById('globalKeywords').value = data.global.keywords || '';
                        document.getElementById('globalEmail').value = data.global.email || '';
                        document.getElementById('globalPhone').value = data.global.phone || '';
                        document.getElementById('globalWhatsapp').value = data.global.whatsapp || '';
                        document.getElementById('globalAddress').value = data.global.address || '';
                        
                        if (data.global.social) {
                            document.getElementById('socialInstagram').value = data.global.social.instagram || '';
                            document.getElementById('socialLinkedin').value = data.global.social.linkedin || '';
                            document.getElementById('socialBehance').value = data.global.social.behance || '';
                            document.getElementById('socialDribbble').value = data.global.social.dribbble || '';
                        }
                    }
                } catch (e) {
                    console.error('Error loading content:', e);
                }
            }
        }

        // Toast
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.transform = 'translateX(100%)';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Logout
        function logoutAdmin() {
            sessionStorage.removeItem('adminAuth');
            localStorage.removeItem('adminRemember');
            window.location.href = '/admin/login.html';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderServices();
            loadContent();
            setupCounters();
        });
    </script>
</body>
</html>
