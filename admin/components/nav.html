<style>
.sidebar-item {
    position: relative;
    overflow: hidden;
}

.sidebar-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.5s;
}

.sidebar-item:hover::before {
    left: 100%;
}

.sidebar-item.active {
    background: rgba(255,255,255,0.15);
    border-left: 3px solid #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

/* Mobile styles */
@media (max-width: 1024px) {
    .admin-sidebar {
        position: fixed;
        left: -280px;
        transition: left 0.3s ease;
        z-index: 100;
    }
    
    .admin-sidebar.open {
        left: 0;
    }
    
    #mobile-menu-toggle {
        display: flex;
    }
}

@media (min-width: 1025px) {
    #mobile-menu-toggle {
        display: none;
    }
}

/* Touch targets */
.touch-target {
    min-height: 44px;
    min-width: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

/* Smooth transitions */
.admin-sidebar {
    transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

#admin-menu-overlay {
    transition: opacity 0.3s ease;
}

#admin-menu-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

#admin-menu-overlay:not(.hidden) {
    opacity: 1;
    pointer-events: auto;
}
</style>

<script>
// Load counts for badges
async function loadCounts() {
    try {
        const API_BASE = '/api';
        
        // Load portfolio count
        const portfolioRes = await fetch(`${API_BASE}/portfolio`, {
            headers: { 'Authorization': 'Bearer MADA2024' }
        });
        const portfolioData = await portfolioRes.json();
        document.getElementById('portfolio-count').textContent = portfolioData.projects?.length || 0;
        
        // Load media count
        const mediaRes = await fetch(`${API_BASE}/media`, {
            headers: { 'Authorization': 'Bearer MADA2024' }
        });
        const mediaData = await mediaRes.json();
        document.getElementById('media-count').textContent = mediaData.files?.length || 0;
        
        // Content count is static for now
        document.getElementById('content-count').textContent = '6';
    } catch (error) {
        console.error('Error loading counts:', error);
        // Set fallback values
        document.getElementById('portfolio-count').textContent = '0';
        document.getElementById('media-count').textContent = '0';
        document.getElementById('content-count').textContent = '6';
    }
}

// Highlight current page
document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.sidebar-item').forEach(item => {
        const href = item.getAttribute('href');
        if (href === currentPage || (currentPage === 'index.html' && href === '/admin/')) {
            item.classList.add('active');
        }
    });
    
    loadCounts();
    
    // Mobile menu toggle
    const menuToggle = document.getElementById('mobile-menu-toggle');
    const sidebar = document.querySelector('.admin-sidebar');
    const overlay = document.getElementById('admin-menu-overlay');
    
    if (menuToggle && sidebar) {
        function openMenu() {
            sidebar.classList.add('open');
            if (overlay) overlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        
        function closeMenu() {
            sidebar.classList.remove('open');
            if (overlay) overlay.classList.add('hidden');
            document.body.style.overflow = '';
        }
        
        // Remove old listeners and add new ones
        menuToggle.removeEventListener('click', openMenu);
        menuToggle.addEventListener('click', openMenu);
        
        if (overlay) {
            overlay.removeEventListener('click', closeMenu);
            overlay.addEventListener('click', closeMenu);
        }
        
        // Close on escape key
        document.removeEventListener('keydown', handleEscape);
        document.addEventListener('keydown', handleEscape);
        
        function handleEscape(e) {
            if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                closeMenu();
            }
        }
        
        // Handle resize
        let resizeTimer;
        window.removeEventListener('resize', handleResize);
        window.addEventListener('resize', handleResize);
        
        function handleResize() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                if (window.innerWidth >= 1025) {
                    closeMenu();
                }
            }, 250);
        }
    }
});

// Logout function
function logoutAdmin() {
    sessionStorage.removeItem('adminAuth');
    sessionStorage.removeItem('adminLoginTime');
    localStorage.removeItem('adminRemember');
    window.location.href = '/admin/login.html';
}

// No Vanta initialization - removed to prevent freezing
</script>
