<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin Login · MadaBrand</title>
    <link href="/dist/output.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Three.js & Vanta -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.7;
        }

        /* Floating shapes */
        .shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 1;
            pointer-events: none;
        }
        .shape-1 {
            width: 300px;
            height: 300px;
            background: rgba(30, 58, 138, 0.3);
            top: -100px;
            left: -100px;
            animation: float 15s infinite;
        }
        .shape-2 {
            width: 400px;
            height: 400px;
            background: rgba(37, 99, 235, 0.2);
            bottom: -150px;
            right: -150px;
            animation: float 20s infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        /* Glass card */
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 32px;
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(30, 58, 138, 0.4);
        }

        /* Input fields */
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            transition: all 0.2s;
            font-size: 1.1rem;
        }
        .modern-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s;
            background: white;
        }
        .modern-input:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1);
            outline: none;
        }
        .modern-input:focus + .input-icon {
            color: #1e3a8a;
        }

        /* Button */
        .login-btn {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(30, 58, 138, 0.4);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .glass-card {
                margin: 1rem;
                padding: 2rem !important;
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 16px 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
            border-left: 4px solid;
            max-width: 400px;
        }
        .toast.success { border-color: #10b981; background: #f0fdf4; }
        .toast.error { border-color: #ef4444; background: #fef2f2; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Vanta Background (only on login page) -->
    <div id="vanta-bg"></div>
    
    <!-- Floating Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <!-- Login Card -->
    <div class="glass-card w-full max-w-[480px] p-8 md:p-10 relative z-20">
        <!-- Logo & Brand -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-blue-900 to-blue-600 rounded-2xl mb-4 shadow-lg">
                <i class="fas fa-pen-fancy text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-900 to-blue-600 bg-clip-text text-transparent">
                MadaBrand
            </h1>
            <p class="text-gray-500 mt-2">Admin Portal · Secure Access</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="passcode" class="modern-input" 
                       placeholder="Enter admin passcode" required>
            </div>

            <div class="flex items-center justify-between mb-6">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-gray-300 text-blue-900 focus:ring-blue-900">
                    <span class="text-sm text-gray-600 group-hover:text-blue-900 transition">Remember me</span>
                </label>
                <a href="#" class="text-sm text-blue-900 hover:text-blue-700 transition flex items-center gap-1">
                    <i class="fas fa-question-circle"></i>
                    <span>Need help?</span>
                </a>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                <span id="btnText" class="flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Sign In to Dashboard</span>
                </span>
                <span id="btnSpinner" class="hidden">
                    <i class="fas fa-spinner fa-spin"></i> Verifying...
                </span>
            </button>
        </form>

        <!-- Quick Hint -->
        <div class="mt-6 p-4 bg-blue-50 rounded-xl border border-blue-100">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-900 rounded-full flex items-center justify-center text-white text-sm">💡</div>
                <div>
                    <p class="text-xs text-gray-500">Demo passcode</p>
                    <p class="font-mono font-bold text-blue-900">MADA2024</p>
                </div>
            </div>
        </div>

        <!-- Security Badge -->
        <div class="mt-6 text-center">
            <div class="inline-flex items-center gap-2 text-xs text-gray-400">
                <i class="fas fa-shield-alt text-blue-900"></i>
                <span>256-bit SSL Encrypted</span>
                <span class="w-1 h-1 bg-gray-300 rounded-full"></span>
                <i class="fas fa-clock"></i>
                <span>Session auto-locks after 30min</span>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSCODE = "MADA2024";

        // Vanta
        VANTA.NET({
            el: "#vanta-bg",
            color: 0x1e3a8a,
            backgroundColor: 0x0a0f1e,
            points: 15,
            maxDistance: 25,
            spacing: 18,
            showDots: false
        });

        // Check existing session
        if (sessionStorage.getItem('adminAuth') === 'true' || localStorage.getItem('adminRemember') === 'true') {
            window.location.href = '/admin/';
        }

        // Form submit
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const passcode = document.getElementById('passcode').value;
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const input = document.getElementById('passcode');

            // Remove existing errors
            input.classList.remove('border-red-500', 'ring-2', 'ring-red-200');
            const oldError = document.querySelector('.error-message');
            if (oldError) oldError.remove();

            // Show loading
            btnText.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
            btn.disabled = true;

            setTimeout(() => {
                if (passcode === ADMIN_PASSCODE) {
                    // Success
                    sessionStorage.setItem('adminAuth', 'true');
                    sessionStorage.setItem('adminLoginTime', Date.now().toString());
                    
                    if (document.getElementById('rememberMe').checked) {
                        localStorage.setItem('adminRemember', 'true');
                    }

                    // Show success toast
                    showToast('Access granted! Redirecting...', 'success');
                    
                    // Redirect
                    setTimeout(() => {
                        window.location.href = '/admin/';
                    }, 1000);
                } else {
                    // Error
                    input.classList.add('border-red-500', 'ring-2', 'ring-red-200');
                    
                    const errorMsg = document.createElement('p');
                    errorMsg.className = 'error-message text-red-600 text-sm mt-2 flex items-center gap-1';
                    errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Invalid passcode. Try MADA2024';
                    input.parentNode.appendChild(errorMsg);

                    // Shake animation
                    input.style.animation = 'shake 0.3s';
                    setTimeout(() => input.style.animation = '', 300);

                    // Reset button
                    btnText.classList.remove('hidden');
                    btnSpinner.classList.add('hidden');
                    btn.disabled = false;
                }
            }, 800);
        });

        // Toast
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} text-xl"></i>
                <span class="font-medium">${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.transform = 'translateX(100%)';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // Shake keyframe
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
