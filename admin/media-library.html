<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Media Library · MadaBrand Admin</title>
    <link href="/dist/output.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Include admin CSS -->
    <link href="/admin/css/admin.css" rel="stylesheet">
    
    <style>
        /* Simplified background - no Vanta to prevent freezing */
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        
        /* Ensure content is visible */
        .main-content {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Simple gradient background instead of Vanta -->
    <div class="fixed inset-0 bg-gradient-to-br from-blue-900 via-blue-800 to-blue-900 opacity-90"></div>

    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars text-xl text-white"></i>
    </button>

    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <!-- Include nav via JS or direct HTML -->
            <div id="nav-container"></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="page-title">
                    <h1>Media Library</h1>
                    <p>Manage your images and files</p>
                </div>
                <div class="storage-badge" id="storageIndicator">
                    <i class="fas fa-database"></i>
                    <span>0 MB / 100 MB</span>
                </div>
            </div>

            <!-- Upload Section -->
            <div class="upload-section">
                <h2>
                    <i class="fas fa-cloud-upload-alt text-blue-900"></i>
                    Upload New Images
                </h2>

                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" multiple accept="image/*" hidden>
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <p class="text-lg font-medium text-gray-700 mb-2">Drop images here or click to browse</p>
                    <p class="text-sm text-gray-500 mb-4">Supports JPG, PNG, GIF, WebP (max 5MB each)</p>
                    <button type="button" class="btn-secondary" onclick="document.getElementById('fileInput').click()">
                        Choose Files
                    </button>
                </div>

                <!-- Progress -->
                <div id="uploadProgress" class="progress-container hidden">
                    <div class="flex justify-between text-sm mb-2">
                        <span>Uploading...</span>
                        <span id="uploadPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="uploadBar" class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="toolbar-actions">
                    <button class="toolbar-btn" onclick="selectAll()">
                        <i class="fas fa-check-square"></i>
                        Select All
                    </button>
                    <button class="toolbar-btn" onclick="deselectAll()">
                        <i class="fas fa-square"></i>
                        Deselect
                    </button>
                    <button class="toolbar-btn danger" onclick="deleteSelected()">
                        <i class="fas fa-trash"></i>
                        Delete Selected (<span id="selectedCount">0</span>)
                    </button>
                </div>
                <div class="toolbar-search">
                    <input type="text" id="searchInput" placeholder="Search images..." oninput="filterMedia()">
                    <select id="typeFilter" onchange="filterMedia()">
                        <option value="all">All Types</option>
                        <option value="jpeg">JPG</option>
                        <option value="png">PNG</option>
                        <option value="gif">GIF</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
            </div>

            <!-- Media Grid -->
            <div id="mediaGrid" class="media-grid">
                <!-- Loading -->
                <div class="col-span-full text-center py-12">
                    <div class="spinner mx-auto"></div>
                    <p class="text-gray-500 mt-3">Loading media library...</p>
                </div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state hidden">
                <i class="fas fa-images"></i>
                <h3>No images yet</h3>
                <p>Upload your first image to get started</p>
                <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
                    Upload Now
                </button>
            </div>

            <!-- Load More -->
            <div id="loadMore" class="load-more hidden">
                <button class="load-more-btn" onclick="loadMore()">
                    Load More Images
                </button>
            </div>
        </main>
    </div>

    <!-- Image Preview Modal -->
    <div id="previewModal" class="modal hidden" onclick="if(event.target === this) closePreviewModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Image Details</h3>
                <span class="modal-close" onclick="closePreviewModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="image-detail" id="previewContent">
                    <!-- Content will be injected -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://madabrand.onrender.com/api';
        let mediaItems = [];
        let selectedItems = new Set();
        let currentPage = 1;
        const itemsPerPage = 24;
        let filteredItems = [];

        // Auth check
        if (!sessionStorage.getItem('adminAuth') && !localStorage.getItem('adminRemember')) {
            window.location.href = '/admin/login.html';
        }

        // Load navigation
        fetch('/admin/components/nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-container').innerHTML = data;
            })
            .catch(error => {
                console.error('Error loading nav:', error);
                document.getElementById('nav-container').innerHTML = '<div class="p-4 text-red-500">Error loading navigation</div>';
            });

        // Sidebar toggle
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        document.addEventListener('click', function(e) {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.querySelector('.mobile-menu-btn');
            if (window.innerWidth <= 1024 && 
                sidebar && 
                !sidebar.contains(e.target) && 
                menuBtn && 
                !menuBtn.contains(e.target) && 
                sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            }
        });

        // Load media
        async function loadMedia() {
            try {
                const response = await fetch(`${API_BASE}/media`, {
                    headers: { 'Authorization': 'Bearer MADA2024' }
                });
                const data = await response.json();
                mediaItems = data.files || [];
            } catch (error) {
                console.error('Error loading media:', error);
                // Fallback to default images
                mediaItems = getDefaultMedia();
            }
            
            updateStorage();
            renderMedia();
        }

        // Default media
        function getDefaultMedia() {
            return [
                { id: 'img1', name: 'photo_1_2025-12-10_09-45-08.jpg', url: '/assets/images/photo_1_2025-12-10_09-45-08.jpg', size: 245760, type: 'image/jpeg' },
                { id: 'img2', name: 'photo_2_2025-12-10_09-45-08.jpg', url: '/assets/images/photo_2_2025-12-10_09-45-08.jpg', size: 189440, type: 'image/jpeg' },
                { id: 'img3', name: 'photo_3_2025-12-10_09-45-08.jpg', url: '/assets/images/photo_3_2025-12-10_09-45-08.jpg', size: 210944, type: 'image/jpeg' },
                { id: 'img4', name: 'photo_4_2025-12-10_09-45-08.jpg', url: '/assets/images/photo_4_2025-12-10_09-45-08.jpg', size: 198656, type: 'image/jpeg' },
                { id: 'img5', name: 'photo_5_2025-12-10_09-49-24.jpg', url: '/assets/images/photo_5_2025-12-10_09-49-24.jpg', size: 225280, type: 'image/jpeg' },
                { id: 'img6', name: 'photo_6_2025-12-10_09-49-24.jpg', url: '/assets/images/photo_6_2025-12-10_09-49-24.jpg', size: 241664, type: 'image/jpeg' },
                { id: 'img7', name: 'photo_7_2025-12-10_09-49-24.jpg', url: '/assets/images/photo_7_2025-12-10_09-49-24.jpg', size: 233472, type: 'image/jpeg' },
                { id: 'img8', name: 'photo_8_2025-12-10_09-49-24.jpg', url: '/assets/images/photo_8_2025-12-10_09-49-24.jpg', size: 200704, type: 'image/jpeg' },
                { id: 'img9', name: 'photo_9_2025-12-10_09-49-24.jpg', url: '/assets/images/photo_9_2025-12-10_09-49-24.jpg', size: 217088, type: 'image/jpeg' },
                { id: 'img10', name: 'photo_10_2025-12-10_09-49-24.jpg', url: '/assets/images/photo_10_2025-12-10_09-49-24.jpg', size: 253952, type: 'image/jpeg' }
            ];
        }

        // Update storage indicator
        function updateStorage() {
            const totalSize = mediaItems.reduce((acc, item) => acc + (item.size || 0), 0);
            const totalMB = (totalSize / (1024 * 1024)).toFixed(2);
            document.getElementById('storageIndicator').innerHTML = `
                <i class="fas fa-database"></i>
                <span>${totalMB} MB / 100 MB</span>
            `;
        }

        // Format file size
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Filter media
        function filterMedia() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('typeFilter').value;

            filteredItems = mediaItems.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search);
                const matchesType = type === 'all' || item.type?.includes(type);
                return matchesSearch && matchesType;
            });

            currentPage = 1;
            renderMedia();
        }

        // Render media grid
        function renderMedia() {
            const grid = document.getElementById('mediaGrid');
            const empty = document.getElementById('emptyState');
            const loadMore = document.getElementById('loadMore');

            if (filteredItems.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                loadMore.classList.add('hidden');
                return;
            }

            empty.classList.add('hidden');

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const itemsToShow = filteredItems.slice(start, end);

            grid.innerHTML = itemsToShow.map(item => {
                const isSelected = selectedItems.has(item.id);
                return `
                    <div class="media-item ${isSelected ? 'selected' : ''}" data-id="${item.id}">
                        <div class="media-thumb">
                            <img src="${item.url}" alt="${item.name}" onclick="previewImage('${item.id}')">
                            <div class="media-check ${isSelected ? 'checked' : ''}" onclick="toggleSelect('${item.id}')">
                                ${isSelected ? '<i class="fas fa-check"></i>' : ''}
                            </div>
                            <div class="media-actions">
                                <button class="media-action-btn" onclick="previewImage('${item.id}')" title="Preview">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="media-action-btn delete" onclick="deleteImage('${item.id}')" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="media-info">
                            <div class="media-name">${item.name}</div>
                            <div class="media-meta">
                                <span>${formatSize(item.size)}</span>
                                <span>${item.type?.split('/')[1]?.toUpperCase() || 'IMG'}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Show/hide load more
            if (filteredItems.length > end) {
                loadMore.classList.remove('hidden');
            } else {
                loadMore.classList.add('hidden');
            }

            updateSelectedCount();
        }

        // Load more
        function loadMore() {
            currentPage++;
            renderMedia();
        }

        // Toggle select
        window.toggleSelect = function(id) {
            if (selectedItems.has(id)) {
                selectedItems.delete(id);
            } else {
                selectedItems.add(id);
            }
            renderMedia();
        };

        // Select all
        window.selectAll = function() {
            filteredItems.slice(0, currentPage * itemsPerPage).forEach(item => {
                selectedItems.add(item.id);
            });
            renderMedia();
        };

        // Deselect all
        window.deselectAll = function() {
            selectedItems.clear();
            renderMedia();
        };

        // Update selected count
        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = selectedItems.size;
        }

        // Delete selected
        window.deleteSelected = function() {
            if (selectedItems.size === 0) return;
            
            if (confirm(`Delete ${selectedItems.size} selected image(s)?`)) {
                mediaItems = mediaItems.filter(item => !selectedItems.has(item.id));
                selectedItems.clear();
                localStorage.setItem('madabrandMedia', JSON.stringify(mediaItems));
                updateStorage();
                filterMedia();
                showToast('Images deleted', 'success');
            }
        };

        // Delete single image
        window.deleteImage = function(id) {
            if (confirm('Delete this image?')) {
                mediaItems = mediaItems.filter(item => item.id !== id);
                selectedItems.delete(id);
                localStorage.setItem('madabrandMedia', JSON.stringify(mediaItems));
                updateStorage();
                filterMedia();
                showToast('Image deleted', 'success');
            }
        };

        // Preview image
        window.previewImage = function(id) {
            const item = mediaItems.find(i => i.id === id);
            if (!item) return;

            const content = document.getElementById('previewContent');
            content.innerHTML = `
                <img src="${item.url}" alt="${item.name}">
                <div class="detail-grid">
                    <div class="detail-item">
                        <div class="detail-label">Filename</div>
                        <div class="detail-value">${item.name}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Size</div>
                        <div class="detail-value">${formatSize(item.size)}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Type</div>
                        <div class="detail-value">${item.type || 'image/jpeg'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">URL</div>
                        <div class="detail-value" style="font-size: 0.7rem;">${item.url}</div>
                    </div>
                </div>
                <div class="flex gap-3 justify-end mt-4">
                    <button class="btn-secondary" onclick="copyUrl('${item.url}')">
                        <i class="fas fa-copy"></i> Copy URL
                    </button>
                    <button class="btn-primary" onclick="downloadImage('${item.url}')">
                        <i class="fas fa-download"></i> Download
                    </button>
                </div>
            `;

            document.getElementById('previewModal').classList.remove('hidden');
        };

        function closePreviewModal() {
            document.getElementById('previewModal').classList.add('hidden');
        }

        function copyUrl(url) {
            navigator.clipboard.writeText(url);
            showToast('URL copied!', 'success');
        }

        function downloadImage(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = url.split('/').pop();
            a.click();
        }

        // File upload
        document.getElementById('fileInput').addEventListener('change', handleFiles);
        
        const uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-blue-900', 'bg-blue-50');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-blue-900', 'bg-blue-50');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-blue-900', 'bg-blue-50');
            handleFiles({ target: { files: e.dataTransfer.files } });
        });

        async function handleFiles(e) {
            const files = e.target.files;
            const progress = document.getElementById('uploadProgress');
            const bar = document.getElementById('uploadBar');
            const percent = document.getElementById('uploadPercent');
            
            progress.classList.remove('hidden');
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                if (!file.type.startsWith('image/')) {
                    showToast(`${file.name} is not an image`, 'error');
                    continue;
                }
                
                if (file.size > 5 * 1024 * 1024) {
                    showToast(`${file.name} exceeds 5MB`, 'error');
                    continue;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const newImage = {
                        id: 'img-' + Date.now() + '-' + i,
                        name: file.name,
                        url: e.target.result,
                        size: file.size,
                        type: file.type
                    };
                    mediaItems.push(newImage);
                };
                reader.readAsDataURL(file);

                const pct = ((i + 1) / files.length) * 100;
                bar.style.width = pct + '%';
                percent.textContent = Math.round(pct) + '%';
            }

            setTimeout(() => {
                progress.classList.add('hidden');
                bar.style.width = '0%';
                percent.textContent = '0%';
                localStorage.setItem('madabrandMedia', JSON.stringify(mediaItems));
                updateStorage();
                filterMedia();
                showToast(`Uploaded ${files.length} image(s)`, 'success');
            }, 500);
        }

        // Toast
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.transform = 'translateX(100%)';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Logout
        function logoutAdmin() {
            sessionStorage.removeItem('adminAuth');
            localStorage.removeItem('adminRemember');
            window.location.href = '/admin/login.html';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadMedia();
        });
    </script>
</body>
</html>
